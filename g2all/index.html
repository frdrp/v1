<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams PlayStation - FW 5.05 - 13.52 GoldHEN Host</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #050a14;
    --bg-grid: #0a1224;
    --card: rgba(13, 22, 43, 0.85);
    --border: #1a2b4c;
    --accent: #0070D1; /* Biru PlayStation */
    --accent-glow: #00A0FF;
    --text: #E6EDF3;
    --text-dim: #8B98A9;
    --yellow: #FACC15;
    --red: #EF4444;
    --glow: rgba(0, 160, 255, 0.25);
    --wa-green: #25D366;
  }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    color: var(--text);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
  }

  /* ── Container Utama ── */
  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 780px;
    width: 100%;
    gap: 20px;
  }

  /* ── Logo ── */
  .logo-container {
    width: 100%;
    max-width: 320px;
    margin-bottom: 5px;
    filter: drop-shadow(0 0 20px var(--glow));
    animation: float 4s ease-in-out infinite;
  }

  .logo-container img {
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 2px solid var(--border);
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  }

  /* ── Header / Nama Toko ── */
  h1 {
    text-align: center;
    line-height: 1.25;
  }

  hr, br {
    display: none;
  }

  body > h1:first-of-type {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent-glow);
    border-radius: 12px;
    padding: 20px 30px;
    max-width: 780px;
    width: 100%;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text);
    backdrop-filter: blur(10px);
    box-shadow:
      0 0 0 1px rgba(0, 160, 255, 0.1),
      0 20px 40px -20px rgba(0, 0, 0, 0.9),
      0 0 60px -20px var(--glow);
  }

  body > h1:first-of-type::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 14px;
    border-radius: 50%;
    background: var(--accent-glow);
    box-shadow: 0 0 10px var(--accent-glow);
    vertical-align: middle;
    animation: pulse 1.8s ease-in-out infinite;
  }

  /* ── Kotak Status / Pesan Utama ── */
  #msgs {
    display: block;
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--yellow);
    border-radius: 12px;
    padding: 30px 25px;
    max-width: 780px;
    width: 100%;
    font-size: clamp(16px, 2.4vw, 24px) !important;
    font-weight: 600;
    margin: 0 !important;
    text-align: center;
    letter-spacing: 0.5px;
    word-break: break-word;
    color: var(--yellow);
    font-family: 'Consolas', 'Courier New', monospace;
    backdrop-filter: blur(10px);
    box-shadow:
      0 20px 40px -20px rgba(0, 0, 0, 0.9),
      0 0 50px -25px rgba(250, 204, 21, 0.3);
  }

  #msgs::after {
    content: "_";
    color: var(--accent-glow);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  #msgs span {
    color: #fff !important;
    background: var(--red);
    padding: 1px 10px;
    border-radius: 4px;
    font-weight: 800;
  }

  /* ── Footer / Tag Info ── */
  .footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 15px;
    width: 100%;
    font-size: clamp(11px, 1.4vw, 13px);
    font-family: 'Consolas', 'Courier New', monospace;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    backdrop-filter: blur(5px);
  }

  .footer .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-glow);
  }

  .footer .tag.blue::before { background: #0070D1; }
  .footer .tag.yellow::before { background: var(--yellow); }

  /* ── Kontak WhatsApp ── */
  .contact-wa {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px; /* Membuat bentuk kapsul */
    padding: 10px 24px;
    text-decoration: none;
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-weight: bold;
    font-size: clamp(14px, 1.8vw, 16px);
    letter-spacing: 1px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.5);
  }

  .contact-wa:hover {
    border-color: var(--wa-green);
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
    transform: translateY(-2px);
  }

  /* Ikon WhatsApp */
  .contact-wa svg {
    width: 20px;
    height: 20px;
    fill: var(--wa-green);
  }

  .contact-wa span {
    color: var(--text-dim);
    font-size: 0.85em;
    margin-right: 5px;
  }

  /* ── Animasi ── */
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-glow); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ── Responsif ── */
  @media (max-width: 600px) {
    body {
      padding: 20px 14px;
      gap: 16px;
    }
    body > h1:first-of-type {
      padding: 16px 20px;
      letter-spacing: 1px;
    }
    #msgs {
      padding: 24px 16px;
    }
    .logo-container {
      max-width: 220px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body > h1:first-of-type::before,
    #msgs::after,
    .logo-container {
      animation: none;
    }
  }
</style>
</head>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
    });

    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span>' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
