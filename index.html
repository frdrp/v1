<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams PlayStation - Exploit Host</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #050a14;
    --bg-grid: #0a1224;
    --card: rgba(13, 22, 43, 0.85);
    --border: #1a2b4c;
    --accent: #0070D1; /* Biru PlayStation */
    --accent-glow: #00A0FF;
    --text: #E6EDF3;
    --text-dim: #8B98A9;
    --yellow: #FACC15;
    --red: #EF4444;
    --green: #00E5A0;
    --glow: rgba(0, 160, 255, 0.25);
    --wa-green: #25D366;
  }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    color: var(--text);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
  }

  /* ── Container Utama ── */
  .main-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 780px;
    width: 100%;
    gap: 20px;
  }

  /* ── Logo ── */
  .logo-container {
    width: 100%;
    max-width: 320px;
    margin-bottom: 5px;
    filter: drop-shadow(0 0 20px var(--glow));
    animation: float 4s ease-in-out infinite;
  }

  .logo-container img {
    width: 100%;
    height: auto;
    border-radius: 16px;
    border: 2px solid var(--border);
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  }

  /* ── Header ── */
  h1 {
    text-align: center;
    line-height: 1.25;
  }

  hr, br {
    display: none;
  }

  body > h1:first-of-type {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent-glow);
    border-radius: 12px;
    padding: 20px 30px;
    max-width: 780px;
    width: 100%;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text);
    backdrop-filter: blur(10px);
    box-shadow:
      0 0 0 1px rgba(0, 160, 255, 0.1),
      0 20px 40px -20px rgba(0, 0, 0, 0.9),
      0 0 60px -20px var(--glow);
  }

  body > h1:first-of-type::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 14px;
    border-radius: 50%;
    background: var(--accent-glow);
    box-shadow: 0 0 10px var(--accent-glow);
    vertical-align: middle;
    animation: pulse 1.8s ease-in-out infinite;
  }

  /* ── Menu Container ── */
  #menu, #crypto {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 780px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.9);
  }

  /* ── Tombol / Button ── */
  .btn {
    display: block;
    width: 100%;
    max-width: 400px;
    margin: 8px auto;
    padding: 14px 20px;
    background: transparent;
    border: 2px solid var(--accent-glow);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: clamp(14px, 1.8vw, 16px);
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }

  .btn:hover {
    background: var(--accent-glow);
    color: #000;
    box-shadow: 0 0 20px var(--glow);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(1px);
  }

  .btn-multi {
    border-color: var(--yellow);
    color: var(--yellow);
  }

  .btn-multi:hover {
    background: var(--yellow);
    color: #000;
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
  }

  .btn-onln {
    border-color: var(--wa-green);
    color: var(--wa-green);
    font-size: clamp(12px, 1.5vw, 14px);
    margin-top: 30px !important;
    margin-bottom: 20px !important;
    width: 100% !important;
    max-width: 400px;
  }

  .btn-onln:hover {
    background: var(--wa-green);
    color: #000;
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
  }

  /* Warna teks khusus di menu */
  #menu h1[style*="yellow"] {
    color: var(--yellow) !important;
    font-size: clamp(16px, 2vw, 20px) !important;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ── Crypto Section ── */
  #crypto {
    display: none; /* Default tersembunyi, diatur oleh JS */
  }

  #crypto h1 {
    font-size: clamp(14px, 1.8vw, 18px) !important;
    margin: 15px 0;
    font-family: 'Consolas', 'Courier New', monospace;
    word-break: break-all;
  }

  #crypto img {
    border-radius: 8px;
    border: 2px solid var(--border);
    margin: 10px 0;
  }

  /* ── Footer / Kontak WA ── */
  .contact-wa {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 24px;
    text-decoration: none;
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    font-weight: bold;
    font-size: clamp(14px, 1.8vw, 16px);
    letter-spacing: 1px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.5);
  }

  .contact-wa:hover {
    border-color: var(--wa-green);
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
    transform: translateY(-2px);
  }

  .contact-wa svg {
    width: 20px;
    height: 20px;
    fill: var(--wa-green);
  }

  .contact-wa span {
    color: var(--text-dim);
    font-size: 0.85em;
    margin-right: 5px;
  }

  /* ── Animasi ── */
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 4px var(--accent-glow); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* ── Responsif ── */
  @media (max-width: 600px) {
    body {
      padding: 20px 14px;
      gap: 16px;
    }
    body > h1:first-of-type {
      padding: 16px 20px;
      letter-spacing: 1px;
    }
    #menu, #crypto {
      padding: 20px 15px;
    }
    .logo-container {
      max-width: 220px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body > h1:first-of-type::before,
    .logo-container {
      animation: none;
    }
  }
</style>
</head>
